<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/uploads/images/icons/icons8-portfolio-50-3.png">
    <link rel="stylesheet" href="../assets/styles/global.css">
    <link rel="stylesheet" href="../assets/styles/content.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet">
    <title>ADMIN PANEL</title>
</head>
<body class="admin">
    <div id="sidebar-container" data-title="Admin Panel"></div>
    <section class="content">
        <div class="admin-panel-content">
            <h2>Welcome, <span id="username"></span>!<br>What would you like to do?</h2>
            <section class="dashboard-content-manager" aria-labelledby="about-project-title">
                <div class="dashboard-content-heading">
                    <h3 id="about-project-title">Dashboard About Section</h3>
                    <button id="edit-dashboard-content" type="button">Edit About Section</button>
                </div>
                <section class="dashboard-desc" aria-label="Current dashboard About section">
                    <h2>About this project</h2>
                    <hr>
                    <div data-dashboard-about-content aria-live="polite"></div>
                </section>
                <form id="dashboard-content-form" hidden>
                    <label for="dashboard-content-editor">Content</label>
                    <div id="dashboard-content-editor" aria-label="About this project editor"></div>
                    <div class="dashboard-content-actions">
                        <button type="submit">Save About Section</button>
                        <button id="cancel-dashboard-content" type="button" class="secondary-button">Cancel</button>
                    </div>
                </form>
            </section>
        </div>
    </section>
    <script src="../assets/scripts/dashboard-script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
    <script src="../assets/scripts/manage-dashboard-content.js"></script>
</body>
</html>
