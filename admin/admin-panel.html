<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/uploads/images/icons/icons8-portfolio-50-3.png">
    <link rel="stylesheet" href="../assets/styles/global.css">
    <title>ADMIN PANEL</title>
</head>
<body class="admin">
    <div id="sidebar-container" data-title="Admin Panel"></div>
    <section class="content">
        <h2>Welcome, <span id="username"></span> !<br>What would you like to do?</h2>
    </section>

    <script>
        (async () => {
            const res = await fetch('../api/check-session.php');
            const data = await res.json();
            if (!data.loggedIn || !data.isAdmin) {
                window.location.href = '../pages/login.html';
            }
        })();
    </script>
    <script src="../assets/scripts/dashboard-script.js"></script>
</body>
</html>
