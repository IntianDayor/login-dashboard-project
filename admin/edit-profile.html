<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Global styles -->
    <link rel="stylesheet" href="../assets/styles/global.css">
    <!-- Content-specific styles -->
    <link rel="stylesheet" href="../assets/styles/content.css">
    <title>Edit Profile</title>
</head>
<body>
    <main class="edit-profile">
        <!-- Topbar and Sidebar -->
        <section class="topbar">
            <h1 style="font-size: 24px;">Edit Profile</h1>
            <button class="home-button" id="home">&#8962;</button>
            <button class="sidebar-button">&equiv;</button>
        </section>
        <div class="sidebar">
            <button class="sidebar-button-2">&times;</button>
        <ul class="different-data">
            <li class="manage-users" style="list-style-type: none;" id="manage-users">Manage Users</li>
            <li class="upload-projects" style="list-style-type: none;" id="upload-projects">Upload Projects</li>
            <li class="upload-resume" style="list-style-type: none;" id="upload-resume">Upload Resume</li>
            <li class="edit-profile" style="list-style-type: none;" id="edit-profile">Edit Profile</li>
            <li class="home" style="list-style-type: none;" id="home">Home</li>
        </ul>
        <ul>
            <li class="log-out" style="list-style-type: none;" id="log-out">Log Out</li>
        </ul> 
        </div>

        <!-- Edit Profile Content -->
        <section class="content">
            <form class="edit-profile-form">
                <div class="input-profile">
                    <label for="Description">Edit Description:</label>
                    <textarea id="Description" placeholder="Enter your description here..." name="description"></textarea>
                    <label for="profile-picture">Change Profile Picture:</label>
                    <input type="file" id="profile-picture" accept="image/*" name="profile_picture">
                </div>
                <button type="submit">Save Changes</button>
            </form>
        </section>
        
    </main>
    <script src="../assets/scripts/dashboard-script.js"></script>
    <script src="../assets/scripts/manage-profile.js"></script>
</body>
</html>
