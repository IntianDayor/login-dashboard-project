<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Global styles -->
    <link rel="stylesheet" href="../assets/styles/global.css">
    <!-- Content-specific styles -->
    <link rel="stylesheet" href="../assets/styles/content.css">
    <!-- Animation styles -->
    <link rel="stylesheet" href="../assets/styles/animation.css">
    <title>Projects</title>
</head>
<body>
    <main class="upload-projects">
        <!-- Topbar and Sidebar -->
        <section class="topbar">
            <h1 style="font-size: 24px;">Projects</h1>
            <button class="home-button" id="home">&#8962;</button>
            <button class="sidebar-button">&equiv;</button>
        </section>
        <div class="sidebar">
            <button class="sidebar-button-2">&times;</button>
        <ul class="different-data">
            <li class="manage-users" style="list-style-type: none;" id="manage-users">Manage Users</li>
            <li class="upload-projects" style="list-style-type: none;" id="upload-projects">Upload Projects</li>
            <li class="upload-resume" style="list-style-type: none;" id="upload-resume">Upload Resume</li>
            <li class="edit-profile" style="list-style-type: none;" id="edit-profile">Edit Profile</li>
            <li class="home" style="list-style-type: none;" id="home">Home</li>
        </ul>
        <ul>
            <li class="log-out" style="list-style-type: none;" id="log-out">Log Out</li>
        </ul> 
        </div>

        <!-- Projects Content -->
        <section class="content">
            <form action="">
                <div class="user-view" id="user-view">&#128065; User View</div>
                <div class="input-project">
                    <input type="text" placeholder="Project Title" id="project-title">
                    <textarea placeholder="Project Description" id="project-description"></textarea>
                    <input type="file" multiple accept="image/*" id="project-image" accept=".jpg, .jpeg, .png, .gif">
                    <input type="text" placeholder="Project Link" id="project-link">
                    <button id="add-project">Add Project</button>
                </div>
            </form>
        </section>

    </main>
    <script src="../assets/scripts/dashboard-script.js"></script>
    <script src="../assets/scripts/manage-proj-script.js"></script>
</body>
</html>
