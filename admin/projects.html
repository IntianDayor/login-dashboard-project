<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/uploads/images/icons/icons8-portfolio-50-3.png">
    <link rel="stylesheet" href="../assets/styles/global.css">
    <link rel="stylesheet" href="../assets/styles/content.css">
    <link rel="stylesheet" href="../assets/styles/animation.css">
    <!-- Quill CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet">
    <title>Projects | Admin Dashboard</title>
</head>
<body>
    <main class="upload-projects">
        <div id="sidebar-container" data-title="Projects"></div>
        <section class="content">
            <form action="">
                <div class="user-view" id="user-view">&#128065; User View</div>
                <div class="input-project">
                    <input type="text" placeholder="Project Title" id="project-title">
                    <!-- Quill editor replaces textarea -->
                    <label>Project Description:</label>
                    <div id="project-description-editor" style="background:white; min-height: 150px;"></div>
                    <input type="file" multiple accept="image/*" id="project-image">
                    <input type="text" placeholder="Project Link" id="project-link">
                    <button id="add-project">Add Project</button>
                </div>
            </form>
        </section>
    </main>
    <script>
        (async () => {
            const res = await fetch('../api/check-session.php');
            const data = await res.json();
            if (!data.loggedIn || !data.isAdmin) {
                window.location.href = '../pages/login.html';
            }
        })();
    </script>
    <script src="../assets/scripts/dashboard-script.js"></script>
    <!-- DOMPurify for XSS protection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
    <!-- Quill JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
    <script>
        // Initialize Quill on the project description editor
        const quill = new Quill('#project-description-editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['clean']
                ]
            }
        });

        // Makes quill instance available globally so manage-proj-script.js can use it
        window.projectQuill = quill;
    </script>
    <script src="../assets/scripts/manage-proj-script.js"></script>
</body>
</html>
