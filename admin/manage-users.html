<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Global styles -->
    <link rel="stylesheet" href="../assets/styles/global.css">
    <!-- Content-specific styles -->
    <link rel="stylesheet" href="../assets/styles/content.css">
    <title>Manage Users | Admin Dashboard</title>
</head>
<body>
    <main class="manage-users-page">
        <div id="sidebar-container" data-title="Manage Users"></div>
        <!-- Manage Users Content -->
        <section class="content">
            <div class="user-management">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Created</th>
                            <th>Role</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <!-- User rows are dynamically inserted here -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>
    <script>
        (async () => {
            const res = await fetch('../api/check-session.php');
            const data = await res.json();
            if (!data.loggedIn || !data.isAdmin) {
                window.location.href = '../pages/login.html';
            }
        })();
    </script>
    <!-- Dashboard Script -->
    <script src="../assets/scripts/dashboard-script.js"></script>
    <!-- Manage Users Script -->
    <script src="../assets/scripts/manage-users.js"></script>
</body>
</html>
