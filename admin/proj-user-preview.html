<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Global styles -->
    <link rel="stylesheet" href="../assets/styles/global.css">
    <!-- Content-specific styles -->
    <link rel="stylesheet" href="../assets/styles/content.css">
    <!-- Animation styles -->
    <link rel="stylesheet" href="../assets/styles/animation.css">
    <title>Projects | Admin Dashboard</title>
</head>
<body>
    <main class="projects-page">
       <div id="sidebar-container" data-title="Projects"></div>
        <!-- Projects Content -->
        <section class="content">
        <div class="back-to-manage-projects" id="back-to-manage-projects">&#8592; Back to Manage Projects</div>
        <div class="project-cards">
            <!-- Project cards will be dynamically inserted here -->
        </div>
    </section>
    </main>
    <script>
        (async () => {
            const res = await fetch('../api/check-session.php');
            const data = await res.json();
            if (!data.loggedIn || !data.isAdmin) {
                window.location.href = '../pages/login.html';
            }
        })();
    </script>
    <script src="../assets/scripts/dashboard-script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
    <script src="../assets/scripts/manage-proj-script.js"></script>
