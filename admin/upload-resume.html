<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Global styles -->
    <link rel="stylesheet" href="../assets/styles/global.css">
    <!-- Content-specific styles -->
    <link rel="stylesheet" href="../assets/styles/content.css">
    <title>Upload Resume | Admin Dashboard</title>
</head>
<body> 
    <main class="upload-resume">
        <div id="sidebar-container" data-title="Upload Resume"></div>
        <!-- Upload Resume Content -->
        <section class="content">
            <div class="upload-resume-wrapper">
                <form action="../api/upload-resume.php" method="POST" enctype="multipart/form-data">
                    <input type="file" name="resume" accept=".pdf" required>
                    <button type="submit">Upload Resume</button>
                </form>
            </div>
        </section>
    </main>
    <script>
        (async () => {
            const res = await fetch('../api/check-session.php');
            const data = await res.json();
            if (!data.loggedIn || !data.isAdmin) {
                window.location.href = '../pages/login.html';
            }
        })();
    </script>
    <script src="../assets/scripts/dashboard-script.js"></script>
    <script src="../assets/scripts/manage-resume.js"></script>
</body>
</html>
