<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Login</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ccc;
        }
        .log-in {
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .log-in h1 {
            margin-bottom: 20px;
            text-align: center;
        }
        .log-in form {
            display: flex;
            flex-direction: column;
        }
        .log-in input {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .log-in button {
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .log-in button:hover {
            background-color: #0056b3;
        }
        .log-in p {
            font-size: x-small;
            text-align: center;
            padding: 10px;
            text-decoration: underline;
            cursor: pointer;
            border-radius: 30px;
            width: 65px;
            margin: 10px auto;
        }
        .log-in p:hover {
            color: #007BFF;
        }
        .log-in label {
            font-size: x-small; 
            position: relative;
            left: 84%;
            bottom: 37px;
            display: flex;
            flex-direction: column;
            text-align: center;
            width: 30px;
            height: 20px;
            color: transparent;
            transition: color 0.2s;
        }
        .log-in label:hover{
            color: inherit;
        }
        #show-password:hover {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="log-in">
        <h1>Log In</h1>
        <form action="">
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password" id="password">
            <label><input type="checkbox" id="show-password">Show</label>
            <button type="submit">Log In</button>
            <p class="sign-up" id="sign-up-button">Signup Here</p>
        </form>
    </main>
    <script type="module">
        
        import { psuedoDatabase } from './database.js';
        
        const form = document.querySelector('form');
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            const username = form.querySelector('input[type="text"]').value;
            const password = form.querySelector('input[type="password"]').value;

            // No data base yet. Gonna Try to hard code the username and password for now.
            const user = psuedoDatabase.users.find(u => u.username === username && u.password === password);
            if (user) {
                localStorage.setItem('username', username); // Store username in localStorage
                window.location.href = 'dashboard.html';
            } else {
                alert('Invalid username or password.');
            }
        });

        const signupButton = document.getElementById('sign-up-button');
        signupButton.addEventListener('click', () => {
        window.location.href = 'signup.html';
    });

        // Options to show password    
        const showPwd = document.getElementById('show-password');

        showPwd.addEventListener('change', () => {
        password.type = showPwd.checked ? 'text' : 'password';
        });

        

    </script>
</body>
</html>
