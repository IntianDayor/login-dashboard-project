<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/uploads/images/icons/icons8-portfolio-50-3.png">
    <link rel="stylesheet" href="../assets/styles/global.css">
    <title>Register Account | To access Christian Dior Feraer's Info</title>
</head>
<body class="auth">
    <main class="sign-up">
        <form action="">
            <h1>Register an Account</h1>
            <input type="text" placeholder="Username" id="username-reg">
            <input type="text" placeholder="Full Name" id="fullname">
            <input type="email" placeholder="Email Address" id="email">
            <input type="password" placeholder="Create Password" id="create">
            <label>
                <input type="checkbox" id="show-password" onclick="create.type = this.checked ? 'text' : 'password'">
                Show
            </label>
            <input type="password" placeholder="Confirm Password" id="confirmpass">
            <label>
                <input type="checkbox" id="show-password" onclick="confirmpass.type = this.checked ? 'text' : 'password'">
                Show
            </label>
            <button type="submit" id="signup">Sign Up</button>
            <p class="back-to-login" id="back-to-login">Already have an Account?</p>
        </form>
    </main>
    <script src="../assets/scripts/auth.js"></script>
</body>
</html>
