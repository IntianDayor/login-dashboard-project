<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/styles/global.css">
    <title>Christian Dior Feraer's Info</title>
</head>
<body class="auth">
    <main class="log-in">
        <h1>My Info</h1>
        <form action="">
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password" id="password">
            <label><input type="checkbox" id="show-password" onclick="password.type = this.checked ? 'text' : 'password'">
                Show
            </label>
            <button type="submit">Log In</button>
            <p class="sign-up-button" id="sign-up-button">Signup Here</p>
        </form>
    </main>
    <script src="../assets/scripts/auth.js"></script>
</body>
</html>
