<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/uploads/images/icons/icons8-portfolio-50-3.png">
    <link rel="stylesheet" href="../assets/styles/global.css">
    <link rel="stylesheet" href="../assets/styles/content.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet">
    <title>ADMIN PANEL</title>
</head>
<body class="admin">
    <div id="sidebar-container" data-title="Admin Panel"></div>
    <section class="content">
        <div class="admin-panel-content">
            <h2>Welcome, <span id="username"></span>!<br>What would you like to do?</h2>
            <section class="analytics-manager" aria-labelledby="analytics-title">
                <div class="analytics-heading">
                    <div class="analytics-title-group">
                        <h3 id="analytics-title">Site Analytics</h3>
                    </div>
                    <div class="analytics-filter-bar">
                        <div class="analytics-filter-presets">
                            <button type="button" class="analytics-preset-btn" data-days="7">7 Days</button>
                            <button type="button" class="analytics-preset-btn" data-days="14">14 Days</button>
                            <button type="button" class="analytics-preset-btn active" data-days="30">30 Days</button>
                            <button type="button" class="analytics-preset-btn" data-mode="single">Single Date</button>
                            <button type="button" class="analytics-preset-btn" data-mode="custom">Custom Range</button>
                        </div>
                        <div id="analytics-single-picker" class="analytics-picker-group" hidden>
                            <label for="analytics-single-date">Date:</label>
                            <input type="date" id="analytics-single-date" class="analytics-date-input">
                        </div>
                        <div id="analytics-custom-picker" class="analytics-picker-group" hidden>
                            <label for="analytics-start-date">From:</label>
                            <input type="date" id="analytics-start-date" class="analytics-date-input">
                            <label for="analytics-end-date">To:</label>
                            <input type="date" id="analytics-end-date" class="analytics-date-input">
                            <button type="button" id="analytics-custom-apply" class="analytics-apply-btn">Apply</button>
                        </div>
                    </div>
                </div>
                <div class="analytics-stats">
                    <div class="analytics-stat-card">
                        <span class="analytics-stat-value" id="analytics-period-views">—</span>
                        <span class="analytics-stat-label" id="analytics-views-label">Views (Selected Period)</span>
                    </div>
                    <div class="analytics-stat-card">
                        <span class="analytics-stat-value" id="analytics-period-unique">—</span>
                        <span class="analytics-stat-label" id="analytics-unique-label">Unique Visitors (Selected Period)</span>
                    </div>
                    <div class="analytics-stat-card">
                        <span class="analytics-stat-value" id="analytics-today">—</span>
                        <span class="analytics-stat-label">Views Today</span>
                    </div>
                    <div class="analytics-stat-card">
                        <span class="analytics-stat-value" id="analytics-today-unique">—</span>
                        <span class="analytics-stat-label">Unique Today</span>
                    </div>
                </div>
                <div class="analytics-tables">
                    <div class="analytics-table-block">
                        <h4>Top Pages</h4>
                        <table class="analytics-table">
                            <thead><tr><th>Page</th><th>Views</th><th>Uniques</th></tr></thead>
                            <tbody id="analytics-top-pages"><tr><td colspan="3">Loading...</td></tr></tbody>
                        </table>
                    </div>
                    <div class="analytics-charts-column">
                        <div class="analytics-table-block analytics-chart-block">
                            <h4 id="analytics-views-chart-title">Page Views (Last 30 Days)</h4>
                            <div class="analytics-chart-wrapper">
                                <canvas id="analytics-views-chart"></canvas>
                            </div>
                        </div>
                        <div class="analytics-table-block analytics-chart-block">
                            <h4 id="analytics-unique-chart-title">Unique Visitors (Last 30 Days)</h4>
                            <div class="analytics-chart-wrapper">
                                <canvas id="analytics-unique-chart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="dashboard-content-manager" aria-labelledby="about-project-title">
                <div class="dashboard-content-heading">
                    <h3 id="about-project-title">Dashboard About Section</h3>
                    <button id="edit-dashboard-content" type="button">Edit About Section</button>
                </div>
                <section class="dashboard-desc" aria-label="Current dashboard About section">
                    <h2>About this project</h2>
                    <hr>
                    <div data-dashboard-about-content aria-live="polite"></div>
                </section>
                <form id="dashboard-content-form" hidden>
                    <label for="dashboard-content-editor">Content</label>
                    <div id="dashboard-content-editor" aria-label="About this project editor"></div>
                    <div class="dashboard-content-actions">
                        <button type="submit">Save About Section</button>
                        <button id="cancel-dashboard-content" type="button" class="secondary-button">Cancel</button>
                    </div>
                </form>
            </section>
        </div>
    </section>
    <script src="../assets/scripts/dashboard-script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <script src="../assets/scripts/manage-analytics.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
    <script src="../assets/scripts/manage-dashboard-content.js"></script>
</body>
</html>
