<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/uploads/images/icons/icons8-portfolio-50-3.png">
    <!-- Global CSS -->
    <link rel="stylesheet" href="../assets/styles/global.css">
    <!-- Content CSS -->
    <link rel="stylesheet" href="../assets/styles/content.css">
    <!-- Quill CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet">
    <title>Edit Profile | Admin Dashboard</title>
</head>
<body class="admin">
    <main class="edit-profile">
        <div id="sidebar-container" data-title="Edit Profile"></div>
        <section class="content">
            <form class="edit-profile-form">
                <div class="input-profile">
                    <label>Edit Description:</label>
                    <div id="description-editor" style="background:white; min-height: 150px;"></div>
                    <label for="profile-picture">Change Profile Picture:</label>
                    <input type="file" id="profile-picture" accept="image/*" name="profile_picture">
                </div>
                <fieldset class="social-links-editor">
                    <legend>Social links</legend>
                    <p>Paste any social profile URL. The platform name will be detected automatically.</p>
                    <div class="social-links-grid" id="social-links-grid">
                        <label class="social-link-row">Social link 1
                            <input name="social_urls[]" type="url" placeholder="https://your-social-profile.com/your-name">
                            <button class="social-link-remove" type="button" aria-label="Remove social link">×</button>
                        </label>
                    </div>
                    <button class="social-link-add" id="add-social-link" type="button">+ Add another link</button>
                </fieldset>
                <button type="submit">Save Changes</button>
            </form>
        </section>
    </main>
    <script src="../assets/scripts/dashboard-script.js"></script>
    <!-- DOMPurify for XSS protection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
    <!-- Quill JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
    <script>
        // Initialize Quill on the description editor
        const quill = new Quill('#description-editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['clean']
                ]
            }
        });

        // Make quill instance available globally so manage-profile.js can use it
        window.profileQuill = quill;
    </script>
    <script src="../assets/scripts/manage-profile.js"></script>
</body>
</html>
