<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Projects</title>
    <!-- Global styles -->
    <link rel="stylesheet" href="../assets/styles/global.css">
    <!-- Content-specific styles -->
    <link rel="stylesheet" href="../assets/styles/content.css">
    <!-- Animation styles -->
    <link rel="stylesheet" href="../assets/styles/animation.css">
</head>
<body>
    <main class="view-projects">
        <!-- Topbar and Sidebar -->
    <section class="topbar">
        <h1 style="font-size: 24px;">My Projects</h1>
        <button class="home-button" id="home">&#8962;</button>
        <button class="sidebar-button">&equiv;</button>
    </section>
    <div class="sidebar">
        <button class="sidebar-button-2">&times;</button>
        <ul class="different-data">
            <li class="resume" style="list-style-type: none;" id="resume">Resume</li>
            <li class="experience" style="list-style-type: none;" id="profile">Profile</li>
            <li class="projects" style="list-style-type: none;" id="projects">Projects</li>
            <li class="home" style="list-style-type: none;" id="home">Home</li>
        </ul>
        <ul>
            <li class="log-out" style="list-style-type: none;" id="log-out">Log Out</li>
        </ul> 
    </div>

    <!-- Projects Content -->
    <section class="content">
        <div class="projects-wrapper">
            <p class="projects-hint" onclick="window.open('https://github.com/IntianDayor', '_blank')">Click a Project Card you want to overview/review in GitHub!</p>
            <div class="project-cards">
            <!-- Project cards will be dynamically inserted here -->
            </div>
        </div>
    </section>
    </main>

    <!-- Dashboard Scripts -->
    <script src="../assets/scripts/dashboard-script.js"></script>
    <!-- DOMPurify -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
    <!-- Project Scripts -->
    <script src="../assets/scripts/manage-proj-script.js"></script>
</body>
</html>
