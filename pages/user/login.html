<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/uploads/images/icons/icons8-portfolio-50-2.png">
    <link rel="stylesheet" href="../assets/styles/global.css">
    <title>Feraer Portfolio</title>
</head>
<body class="auth">
    <div class="auth-layout auth-login">
        <main class="log-in auth-card">
            <h1>Portfolio Portal</h1>
            <form action="">
                <input type="text" placeholder="Username" name="username">
                <input type="password" placeholder="Password" id="password" name="password">
                <label><input type="checkbox" id="show-password" onclick="password.type = this.checked ? 'text' : 'password'">
                    Show password
                </label>
                <button type="submit">Log In</button>
                <p class="sign-up-button" id="sign-up-button">Create an account</p>
            </form>
        </main>
        <aside class="auth-intro" aria-label="Portfolio access information">
            <span class="auth-intro__eyebrow">Welcome to my portfolio</span>
            <h2>Explore the work behind the profile.</h2>
            <p>Explore my projects and experience in the recruiter dashboard, or download my portfolio PDF for a quick overview.</p>
            <a class="portfolio-pdf-link" href="/api/generate-portfolio-pdf.php" aria-label="Download my portfolio as a PDF">
                <span aria-hidden="true">↓</span> Download portfolio PDF
            </a>
            <p class="pdf-download-status" id="pdf-download-status" role="status" aria-live="polite" hidden></p>
            <div class="demo-account">
                <span>Demo viewer account</span>
                <p><strong>Username:</strong> viewer<br><strong>Password:</strong> 123456</p>
            </div>
        </aside>
    </div>
    <script src="../assets/scripts/auth.js"></script>
    <script src="../assets/scripts/portfolio-pdf-download.js"></script>
</body>
</html>
